name: lumen_kit
description: Flutter widget kit with configurable palettes and interchangeable styles (neon, flat, glass, soft, brutal).
version: 1.0.1
homepage: "https://github.com/saulogatti/lumen-kit"

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
workspace:
  - example
dependencies:
  flutter:
    sdk: flutter
 
  material_ui: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: ^14.7.0

flutter:
  uses-material-design: true
